name: Wheelhouse

# The wheelhouse is a hand-built release asset, so pyproject.toml and the
# published zip drift apart in silence — the only machine that notices is the
# offline one, which is also the one that cannot fix it. Check the published
# asset here instead, where a red build is cheap.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  wheelhouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - name: Published wheelhouse satisfies an offline install
        run: uv run --no-project --with packaging python tools/check_wheelhouse.py
