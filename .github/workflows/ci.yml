name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-groups
      - name: Lint
        run: uv run --group dev ruff check src tests
      - name: Tests
        run: uv run --group dev pytest -q
      - name: Validate every program against schema and semantic rules
        # A PR touching programs/*.json fails CI on invalid data.
        run: uv run towerctl validate programs/*.json
