[project]
name = "towerkit"
version = "0.1.0"
description = "Publication-quality schematic diagrams of corporate insurance programs, plus a TUI editor for the program files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "matplotlib>=3.8",
    "textual>=0.58",
    "rapidfuzz>=3.6",
    "babel>=2.14",
]

[project.scripts]
towerctl = "towerkit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/towerkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
