[project]
name = "towerkit"
version = "0.2.0"
description = "Publication-quality schematic diagrams of corporate insurance programs, plus a TUI editor for the program files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "matplotlib>=3.8",
    "textual>=0.58",
    "rapidfuzz>=3.6",
    "babel>=2.14",
    "dateparser>=1.4.2",
    "openpyxl>=3.1",
    "textual-autocomplete>=4.0",
    "mcp>=2.0",
]

[project.scripts]
towerctl = "towerkit.cli:main"

[tool.uv]
# Runtime installs stay lean: `uv run towerctl` needs no linter/test stack.
# Development: uv sync --group dev
default-groups = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/towerkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# UI and plotting glue: framework generics and callbacks make full strict
# annotation noise; the pure core (model/money/scale/layout/validate/compare)
# stays fully strict.
module = ["towerkit.tui.*", "towerkit.render.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disable_error_code = ["type-arg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
